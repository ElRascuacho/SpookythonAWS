AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Operación Manta Cero (Spookython AWS Track B) — Arquitectura Serverless en us-east-1; costos según uso y cuenta.
  Motor Monte Carlo SEIR-V sobre Grafo Urbano de Manta + Informe Ejecutivo para el Alcalde.

Parameters:
  InviteCodeHashes:
    Type: String
    NoEcho: true
    AllowedPattern: "[a-f0-9]{64}(,[a-f0-9]{64})*"
    Description: SHA-256 de códigos compartidos, separados por comas. Nunca el código original.
  InviteSessionSecret:
    Type: String
    NoEcho: true
    AllowedPattern: "[a-f0-9]{64}"
    Description: Clave aleatoria de 32 bytes en hexadecimal para firmar sesiones.
  InviteAppOrigin:
    Type: String
    AllowedPattern: "https://[^/]+"
    Description: Origen HTTPS del frontend sin barra final; servir API y frontend bajo el mismo origen.
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Clave OpenAI del servidor para boletín y agente de investigación. Nunca se expone al navegador.
  OpenAiNewsModel:
    Type: String
    Default: gpt-4o-mini
    Description: Modelo de OpenAI usado por /api/news.
  CommitteeTableName:
    Type: String
    Default: SpookythonCommittee
    Description: Nombre de la tabla DynamoDB para el comité de aprendizaje y slots.
  CommitteeTrainingEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Habilita el entrenamiento del comité (requiere perfilado cloud previo y autorización de ReleaseOperator).

  OpenAiResearchModel:
    Type: String
    Default: gpt-6.1-terra
    Description: Modelo del agente supervisado de investigación.
  EnableResearchAi:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Habilitar llamadas de pago del agente tras configurar cuotas y credenciales.
  EnableResearchVoice:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Habilitar streaming o interacción de voz con OpenAI Realtime.
  OpenAiResearchVoiceModel:
    Type: String
    Default: gpt-realtime-2.1-mini
    Description: Modelo de voz de OpenAI Realtime.
  OpenAiResearchVoice:
    Type: String
    Default: alloy
    Description: Voz configurada para el agente de investigación.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Timeout: 15
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref SpookythonSimulationsTable
        BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
        INVITE_CODE_HASHES: !Ref InviteCodeHashes
        INVITE_SESSION_SECRET: !Ref InviteSessionSecret
        INVITE_APP_ORIGIN: !Ref InviteAppOrigin
        OPENAI_API_KEY: !Ref OpenAiApiKey
        OPENAI_NEWS_MODEL: !Ref OpenAiNewsModel
        OPENAI_RESEARCH_MODEL: !Ref OpenAiResearchModel
        ENABLE_RESEARCH_AI: !Ref EnableResearchAi
        ENABLE_RESEARCH_VOICE: !Ref EnableResearchVoice
        OPENAI_RESEARCH_VOICE_MODEL: !Ref OpenAiResearchVoiceModel
        OPENAI_RESEARCH_VOICE: !Ref OpenAiResearchVoice
        COMMITTEE_TABLE_NAME: !Ref CommitteeTable
        COMMITTEE_RESULTS_BUCKET: !Ref CommitteeResultsBucket
        COMMITTEE_TRAINING_ENABLED: !Ref CommitteeTrainingEnabled

Resources:
  SpookythonHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  MonteCarloSimFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda/
      Handler: handler.handler
      Description: Ejecuta M corridas Monte Carlo SEIR-V (Nada vs Azar vs Smart Cortafuegos) con semilla determinista.
      Environment:
        Variables:
          COMMITTEE_WORKER_FUNCTION_NAME: !Ref CommitteeWorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SpookythonSimulationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CommitteeTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt CommitteeWorkerFunction.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${CommitteeResultsBucket.Arn}/committee/*"
      Events:
        InvitationRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /api/auth/{action}
            Method: ANY
        ResearchAgentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /api/research/agent
            Method: POST
        NewsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /api/news
            Method: POST
        SimulateRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /simulate
            Method: POST
        MayorReportRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /mayor-report
            Method: POST
        CommitteeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /api/committee/{proxy+}
            Method: ANY

  CommitteeWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Timeout: 600
      MemorySize: 2048
      CodeUri: ../build/lambda/
      Handler: workerHandler.handler
      Description: Worker asíncrono para entrenamiento CEM del comité (Node 22 ARM 2048MB / 600s).
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CommitteeTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${CommitteeResultsBucket.Arn}/committee/*"
            - Effect: Deny
              Action:
                - s3:PutObjectAcl
              Resource: !Sub "${CommitteeResultsBucket.Arn}/*"

  SpookythonSimulationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpookythonSimulations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scenarioKey
          AttributeType: S
      KeySchema:
        - AttributeName: scenarioKey
          KeyType: HASH

  CommitteeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref CommitteeTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CommitteeResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCommitteeResultsAfter7Days
            Status: Enabled
            Prefix: committee/
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Operación Manta Cero — Frontend y Backend Unificado
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${SpookythonHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /prod
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /simulate
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /mayor-report
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL in us-east-1
    Value: !Sub "https://${SpookythonHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  DynamoDBTableName:
    Description: On-Demand DynamoDB Table for reproducible simulation caching
    Value: !Ref SpookythonSimulationsTable
  CloudFrontUrl:
    Description: Unified HTTPS CloudFront URL serving both frontend and backend
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  FrontendBucketName:
    Description: S3 Bucket hosting the production frontend assets
    Value: !Ref FrontendBucket
  CommitteeTableName:
    Description: On-Demand DynamoDB Table for committee jobs, quotas, and policy library
    Value: !Ref CommitteeTable
  CommitteeResultsBucketName:
    Description: Private S3 Bucket for committee progress artifacts, ledgers, and manifests
    Value: !Ref CommitteeResultsBucket
  CommitteeWorkerFunctionArn:
    Description: ARN of dedicated async Committee Worker Lambda function
    Value: !GetAtt CommitteeWorkerFunction.Arn
