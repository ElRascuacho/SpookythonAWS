AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Operación Manta Cero (Spookython AWS Track B) — Arquitectura Serverless 100% Free-Tier en us-east-1.
  Motor Monte Carlo SEIR-V sobre Grafo Urbano de Manta + Informe Ejecutivo para el Alcalde.

Parameters:
  InviteCodeHashes:
    Type: String
    NoEcho: true
    AllowedPattern: "[a-f0-9]{64}(,[a-f0-9]{64})*"
    Description: SHA-256 de códigos compartidos, separados por comas. Nunca el código original.
  InviteSessionSecret:
    Type: String
    NoEcho: true
    AllowedPattern: "[a-f0-9]{64}"
    Description: Clave aleatoria de 32 bytes en hexadecimal para firmar sesiones.
  InviteAppOrigin:
    Type: String
    AllowedPattern: "https?://[^/]+"
    Description: Origen HTTPS del frontend sin barra final; servir API y frontend bajo el mismo origen.
  OpenAiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Clave de OpenAI solo para el boletín diario. Vacía = boletín determinista de respaldo.
  OpenAiNewsModel:
    Type: String
    Default: gpt-4o-mini
    Description: Modelo de OpenAI usado por /api/news.

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Timeout: 15
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref SpookythonSimulationsTable
        BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
        INVITE_CODE_HASHES: !Ref InviteCodeHashes
        INVITE_SESSION_SECRET: !Ref InviteSessionSecret
        INVITE_APP_ORIGIN: !Ref InviteAppOrigin
        OPENAI_API_KEY: !Ref OpenAiApiKey
        OPENAI_NEWS_MODEL: !Ref OpenAiNewsModel

Resources:
  SpookythonHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

  MonteCarloSimFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../build/lambda/
      Handler: handler.handler
      Description: Ejecuta M corridas Monte Carlo SEIR-V (Nada vs Azar vs Smart Cortafuegos) con semilla determinista.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SpookythonSimulationsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0"
      Events:
        InvitationRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /api/auth/{action}
            Method: ANY
        NewsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /api/news
            Method: POST
        SimulateRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /simulate
            Method: POST
        MayorReportRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SpookythonHttpApi
            Path: /mayor-report
            Method: POST

  SpookythonSimulationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpookythonSimulations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scenarioKey
          AttributeType: S
      KeySchema:
        - AttributeName: scenarioKey
          KeyType: HASH

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Operación Manta Cero — Frontend y Backend Unificado
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${SpookythonHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /prod
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /simulate
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /mayor-report
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL in us-east-1
    Value: !Sub "https://${SpookythonHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  DynamoDBTableName:
    Description: On-Demand DynamoDB Table for reproducible simulation caching
    Value: !Ref SpookythonSimulationsTable
  CloudFrontUrl:
    Description: Unified HTTPS CloudFront URL serving both frontend and backend
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
  FrontendBucketName:
    Description: S3 Bucket hosting the production frontend assets
    Value: !Ref FrontendBucket
